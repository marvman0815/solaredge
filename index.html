<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="540">
    <title>SolarEdge Dashboard Continuous</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 1.5rem;
            z-index: 1;
        }
        #audio-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: rgba(0, 0, 0, 0);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="loading-screen">
        Lade SolarEdge Dashboard...
    </div>

    <iframe id="dashboard-frame" src="https://www.hilgers-werkstatt.de/#/" style="position: relative; z-index: 2;"></iframe>

    <audio id="silent-audio" loop preload="auto">
        <source src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjI5LjEwMAAAAAAAAAAAAAAA//OEAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABCAADCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws=" type="audio/mpeg">
    </audio>

    <div id="audio-trigger"></div>

    <script>
        const audio = document.getElementById('silent-audio');
        const trigger = document.getElementById('audio-trigger');
        const iframe = document.getElementById('dashboard-frame');

        function startAudio() {
            audio.play().then(() => {
                console.log('Keep-Alive Audio gestartet.');
                if (trigger) {
                    trigger.style.display = 'none';
                }
            }).catch(error => {
                console.warn('Autoplay blockiert. Warten auf Interaktion...', error);
            });
        }

        window.addEventListener('load', startAudio);

        trigger.addEventListener('click', () => {
            startAudio();
        });

        const REFRESH_INTERVAL = 30 * 60 * 1000;
        setInterval(() => {
            console.log('Lade Dashboard iFrame neu...');
            iframe.src = iframe.src;
        }, REFRESH_INTERVAL);
    </script>
</body>
</html>
