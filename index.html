<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="540">
    <title>SolarEdge Dashboard Continuous</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            color: #ffffff;
        }
        .content-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
            padding: 20px;
            text-align: center;
        }
        .open-btn {
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #f05a28;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            z-index: 3;
        }
        #audio-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.01);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="loading-screen">
        <p>Lade SolarEdge Dashboard...</p>
        <p style="font-size: 0.8rem; color: #aaa; margin-top: 10px;">Falls die Seite weiß bleibt, wird das Einbetten von SolarEdge blockiert:</p>
        <a class="open-btn" href="https://monitoring.solaredge.com/mfe/auth/" target="_self">SolarEdge direkt öffnen</a>
    </div>

    <!-- Einbettung per Object als Alternative zu iFrame -->
    <object data="https://monitoring.solaredge.com/mfe/auth/" class="content-frame" id="dashboard-frame">
        <embed src="https://monitoring.solaredge.com/mfe/auth/" class="content-frame">
    </object>

    <!-- Silent Audio für Standby-Schutz -->
    <audio id="silent-audio" loop preload="auto">
        <source src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjI5LjEwMAAAAAAAAAAAAAAA//OEAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABCAADCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws=" type="audio/mpeg">
    </audio>

    <div id="audio-trigger"></div>

    <script>
        const audio = document.getElementById('silent-audio');
        const trigger = document.getElementById('audio-trigger');

        function startAudio() {
            audio.play().then(() => {
                console.log('Keep-Alive Audio gestartet.');
                if (trigger) {
                    trigger.style.display = 'none';
                }
            }).catch(error => {
                console.warn('Autoplay blockiert. Warten auf Tippen...', error);
            });
        }

        window.addEventListener('load', startAudio);

        trigger.addEventListener('click', startAudio);
    </script>
</body>
</html>
