<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="540">
    <title>Testseite Echo Show Keep-Alive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            color: #ffffff;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
            padding: 20px;
            text-align: center;
        }
        #audio-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.01);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="loading-screen">
        <p>Lade Wikipedia Testseite...</p>
    </div>

    <!-- Test-Einbettung via iFrame (Wikipedia erlaubt das Frame-Embedding) -->
    <iframe id="dashboard-frame" src="https://de.m.wikipedia.org"></iframe>

    <!-- Silent Audio für Standby-Schutz -->
    <audio id="silent-audio" loop preload="auto">
        <source src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjI5LjEwMAAAAAAAAAAAAAAA//OEAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABCAADCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws=" type="audio/mpeg">
    </audio>

    <div id="audio-trigger"></div>

    <script>
        const audio = document.getElementById('silent-audio');
        const trigger = document.getElementById('audio-trigger');

        function startAudio() {
            audio.play().then(() => {
                console.log('Keep-Alive Audio gestartet.');
                if (trigger) {
                    trigger.style.display = 'none';
                }
            }).catch(error => {
                console.warn('Autoplay blockiert. Warten auf Tippen...', error);
            });
        }

        window.addEventListener('load', startAudio);

        trigger.addEventListener('click', startAudio);
    </script>
</body>
</html>
